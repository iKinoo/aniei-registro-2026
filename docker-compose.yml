services:

  # ───────────────────────────────────────────────────────────────────────────
  # MariaDB 10.1 — base de datos legacy (cnciic_aniei)
  # ───────────────────────────────────────────────────────────────────────────
  mysql57:
    image: mariadb:10.1
    container_name: aniei2026_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./db/legacy_cnciic_aniei_2026backup.sql:/docker-entrypoint-initdb.d/01_legacy.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # phpMyAdmin — UI para MySQL 5.7
  # ───────────────────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aniei2026_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST:     mysql57
      PMA_PORT:     3306
      PMA_USER:     root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      mysql57:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL (moderno) — esquema nuevo aniei2026
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: aniei2026
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/aniei2026.sql:/docker-entrypoint-initdb.d/01_aniei2026.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # pgAdmin — UI para PostgreSQL
  # ───────────────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aniei2026_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./db/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────────────
  # Next.js 15 — aplicación web (Node.js 22 LTS + pnpm)
  # ───────────────────────────────────────────────────────────────────────────
  web:
    image: node:24-alpine
    container_name: aniei2026_web
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      PNPM_HOME: /pnpm
      PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./app:/app
      - pnpm_store:/pnpm/store
    ports:
      - "3000:3000"
    command: >
      sh -c "corepack enable pnpm &&
             pnpm install &&
             pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mysql_data:
  postgres_data:
  pgadmin_data:
  pnpm_store:
